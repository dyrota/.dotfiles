# Laptop panel (Framework 16). Omarchy turns it off on lid close when an
# external display is connected, and back on when the lid opens.
monitor=eDP-1,2560x1600@165,0x0,1.60

# External monitors: matched by description (serial), never by port name.
# Port names (DP-2, DP-11, DP-12...) change between the HDMI card and the
# USB-C MST adapter, which is what kept breaking resolutions before.
# 60Hz on purpose: two 1080p@144 streams exceed the adapter's 2-lane DP link.
monitor=desc:Microstep MSI G273 CA7A493505454,1920x1080@60,1600x0,1
monitor=desc:Microstep MSI G273 CA7A493509996,1920x1080@60,3520x0,1

# Old Dell 4K (only applies if it is plugged in)
monitor=desc:Dell Inc. DELL S2721QS J44TZY3,3840x2160@60,auto-right,1.50

# Anything else: native resolution, to the right, scale 1.
monitor=,preferred,auto-right,1

# Workspaces: 1-5 on the left MSI, 6-10 on the right MSI. If those monitors
# aren't connected these rules don't match and workspaces stay on the laptop.
workspace=1,monitor:desc:Microstep MSI G273 CA7A493505454,persistent:true,default:true
workspace=2,monitor:desc:Microstep MSI G273 CA7A493505454,persistent:true
workspace=3,monitor:desc:Microstep MSI G273 CA7A493505454,persistent:true
workspace=4,monitor:desc:Microstep MSI G273 CA7A493505454,persistent:true
workspace=5,monitor:desc:Microstep MSI G273 CA7A493505454,persistent:true
workspace=6,monitor:desc:Microstep MSI G273 CA7A493509996,persistent:true,default:true
workspace=7,monitor:desc:Microstep MSI G273 CA7A493509996,persistent:true
workspace=8,monitor:desc:Microstep MSI G273 CA7A493509996,persistent:true
workspace=9,monitor:desc:Microstep MSI G273 CA7A493509996,persistent:true
workspace=10,monitor:desc:Microstep MSI G273 CA7A493509996,persistent:true
